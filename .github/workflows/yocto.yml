# Full Yocto build of telemetry-image-dev for qemux86-64, then boot it in
# QEMU and run the OEQA runtime tests (generic ones plus
# meta-telemetry/lib/oeqa/runtime/cases/telemetryd.py, which also runs the
# ptest suite on the target).
#
# This takes hours on a hosted runner, so it runs on demand and for release
# tags rather than on every push. The shared-state CDN (kas/common.yml) and
# the cache below make repeat runs much faster.
name: Yocto image

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: yocto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      KAS_CLONE_DEPTH: "1"
      DL_DIR: /home/runner/yocto-cache/downloads
      SSTATE_DIR: /home/runner/yocto-cache/sstate-cache
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      - name: Install host dependencies and kas
        run: ./scripts/setup-host-ubuntu.sh

      - name: Enable KVM for QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore downloads and shared state
        uses: actions/cache@v6
        with:
          path: /home/runner/yocto-cache
          key: yocto-wrynose-${{ hashFiles('kas/*.yml', 'meta-telemetry/**', 'app/**') }}
          restore-keys: |
            yocto-wrynose-

      - name: Build telemetry-image-dev
        run: kas build kas/ci.yml

      - name: Boot in QEMU and run runtime tests
        run: kas build kas/ci.yml -c testimage

      - name: Disk usage
        if: always()
        run: df -h / && du -sh build/tmp /home/runner/yocto-cache/* 2>/dev/null || true

      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testimage-results
          path: |
            build/tmp/log/oeqa/
            build/tmp/work/*/telemetry-image-dev/*/testimage/
            build/tmp/work/*/telemetry-image-dev/*/temp/log.do_testimage*
          if-no-files-found: ignore

      - name: Upload QEMU image
        uses: actions/upload-artifact@v7
        with:
          name: telemetry-image-dev-qemux86-64
          path: |
            build/tmp/deploy/images/qemux86-64/telemetry-image-dev-qemux86-64.rootfs.ext4.zst
            build/tmp/deploy/images/qemux86-64/telemetry-image-dev-qemux86-64.rootfs.qemuboot.conf
            build/tmp/deploy/images/qemux86-64/bzImage
          retention-days: 7
