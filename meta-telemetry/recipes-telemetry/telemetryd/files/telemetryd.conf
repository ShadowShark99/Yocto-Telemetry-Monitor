# /etc/telemetryd/telemetryd.conf - default target configuration.
#
# Machine-specific variants live in files/<override>/telemetryd.conf next to
# this file (see files/rpi/). BitBake picks the most specific one through
# FILESOVERRIDES, so no recipe changes are needed per board.
#
# Apply edits with: systemctl reload telemetryd

udp_bind = 0.0.0.0
udp_port = 5500

# No serial input by default (QEMU has no spare UART).
serial_device = ""
serial_baud   = 115200

temp_high_c       = 70
temp_low_c        = -10
humidity_high_pct = 90
voltage_low_v     = 3.0
stale_timeout_ms  = 5000

report_interval_s = 30
status_file       = /run/telemetryd/status.json
max_sensors       = 32
log_level         = info
