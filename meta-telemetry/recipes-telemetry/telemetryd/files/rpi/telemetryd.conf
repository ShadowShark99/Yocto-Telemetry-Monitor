# /etc/telemetryd/telemetryd.conf - Raspberry Pi variant.
#
# Selected automatically for every Raspberry Pi machine: meta-raspberrypi
# sets SOC_FAMILY = "rpi", which adds "rpi" to MACHINEOVERRIDES, which makes
# BitBake prefer files/rpi/telemetryd.conf over files/telemetryd.conf.
#
# The Pi's own UART carries the login console, so sensor nodes connect
# through a USB-UART adapter. telemetryd keeps retrying until it is plugged in.

udp_bind = 0.0.0.0
udp_port = 5500

serial_device = /dev/ttyUSB0
serial_baud   = 115200

temp_high_c       = 70
temp_low_c        = -10
humidity_high_pct = 90
voltage_low_v     = 3.0
stale_timeout_ms  = 5000

report_interval_s = 30
status_file       = /run/telemetryd/status.json
max_sensors       = 32
log_level         = info
