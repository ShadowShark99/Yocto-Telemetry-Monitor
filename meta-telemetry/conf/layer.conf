# meta-telemetry: integrates the telemetry monitor into a Yocto Project image.

# Add this layer to BBPATH so its conf/, classes/ and lib/ (OEQA tests) are found.
BBPATH .= ":${LAYERDIR}"

# Recipes live in recipes-<category>/<recipe>/.
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "telemetry"
BBFILE_PATTERN_telemetry = "^${LAYERDIR}/"
BBFILE_PRIORITY_telemetry = "10"

LAYERVERSION_telemetry = "1"

# core = OpenEmbedded-Core; openembedded-layer = meta-oe, which provides the
# googletest recipe used for the on-target unit tests (ptest).
LAYERDEPENDS_telemetry = "core openembedded-layer"

# Yocto Project 6.0 LTS. Add new release names here only after testing.
LAYERSERIES_COMPAT_telemetry = "wrynose"
